# Local / optional Postgres for SIABUMDES integration tests.
# Free GitHub Actions cannot gain a `services: postgres` job until the
# OAuth App / token used to push includes the `workflow` scope (current
# scopes: gist, read:org, repo). Until then, run this stack locally or
# on a machine with a PAT that can edit `.github/workflows/ci.yml`.
#
# Usage:
#   docker compose -f docker-compose.pg-ci.yml up -d
#   export DATABASE_URL=postgresql://siabumdes:siabumdes@127.0.0.1:55432/siabumdes_test
#   python -m pytest tests/test_postgresql_integration.py tests/test_b1_stock_atomicity.py -n 0
#   docker compose -f docker-compose.pg-ci.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siabumdes
      POSTGRES_PASSWORD: siabumdes
      POSTGRES_DB: siabumdes_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siabumdes -d siabumdes_test"]
      interval: 3s
      timeout: 3s
      retries: 10
