name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        # No database env is set: tests that need a real Postgres instance
        # skip themselves (see tests/test_marketplace_erp_pg_selfheal.py,
        # gated on TEST_DATABASE_URL) instead of failing, so this job stays
        # fast and needs no DB service. The app itself must import and pass
        # tests without any DATABASE_URL* set.
        # `python -m pytest` (not the bare `pytest` script) so the repo root
        # is added to sys.path -- otherwise `from tenants...` imports fail
        # with ModuleNotFoundError since tests/ has no package __init__.py.
        run: python -m pytest tests/ -n 0

  integration-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sm85
          POSTGRES_PASSWORD: sm85
          POSTGRES_DB: sm85_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sm85 -d sm85_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Postgres integration tests
        # SIABUMDES Postgres tests moved to sm85-code/backend-siabumdes. What
        # remains here is the marketplace_erp and bumi_lestari schema self-heal
        # against a real (throwaway) Postgres. -rs prints the reason if it ever skips.
        env:
          TEST_DATABASE_URL: postgresql://sm85:sm85@localhost:5432/sm85_test
        run: python -m pytest tests/test_marketplace_erp_pg_selfheal.py tests/test_bumi_lestari_pg_selfheal.py tests/test_stage2_pg_migration.py tests/test_keu_pg.py tests/test_marketplace_erp_assistant_pg.py -n 0 -rs
