name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        # DATABASE_URL is intentionally unset: tests that need a real Postgres
        # instance skip themselves (see tests/test_postgresql_integration.py)
        # instead of failing, so this job stays fast and needs no DB service.
        # `python -m pytest` (not the bare `pytest` script) so the repo root
        # is added to sys.path -- otherwise `from tenants...` imports fail
        # with ModuleNotFoundError since tests/ has no package __init__.py.
        run: python -m pytest tests/ -n 0
